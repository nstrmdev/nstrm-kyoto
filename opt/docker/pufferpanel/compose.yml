services:
  pufferpanel:
    image: pufferpanel/pufferpanel:3.0.9
    container_name: pufferpanel
    restart: unless-stopped

    ports:
      - "127.0.0.1:5657:5657"

    volumes:
      - /srv/docker/pufferpanel/config:/etc/pufferpanel
      - /srv/docker/pufferpanel/data:/var/lib/pufferpanel
      - /srv/docker/pufferpanel/logs:/var/log/pufferpanel
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      TZ: ${TZ:-Europe/Stockholm}
      PUFFER_WEB_HOST: 0.0.0.0:8080
      PUFFER_PANEL_SETTINGS_MASTERURL: ${APP_URL:?Set APP_URL to your PufferPanel URL}
      PUFFER_PANEL_REGISTRATIONENABLED: "false"
      PUFFER_PANEL_WEB_COOKIES_SECURE: "true"
      PUFFER_PANEL_WEB_COOKIES_HTTPONLY: "true"
      PUFFER_PANEL_DATABASE_DIALECT: sqlite3
      PUFFER_PANEL_DATABASE_URL: file:/var/lib/pufferpanel/database.db?cache=shared
      PUFFER_DAEMON_DATA_ROOT: /var/lib/pufferpanel
      PUFFER_DOCKER_ROOT: /srv/docker/pufferpanel/data
      PUFFER_DOCKER_DISALLOWHOST: "true"
      PUFFER_LOGS: /var/log/pufferpanel

    networks:
      - cloudflared

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  cloudflared:
    external: true
